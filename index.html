<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1">
<title>个人空间 · Life OS</title>
<style>
:root{--bg:#f6f5f1;--paper:#fffefa;--ink:#252823;--muted:#85877f;--line:#e9e7df;--green:#687d68;--green-light:#e8eee6;--peach:#f4e7dc;--lav:#ece9f5;--shadow:0 12px 36px #292d2410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #91a58e;outline-offset:2px}.app{max-width:1120px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:15px;background:var(--green);color:white;display:grid;place-items:center;font-size:21px}.brand h1{font-size:18px;letter-spacing:.04em;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.primary{border:0;background:var(--green);color:#fff;padding:11px 17px;border-radius:13px;font-weight:600}.primary:hover{background:#566b56}.ghost{border:1px solid var(--line);background:var(--paper);padding:9px 13px;border-radius:11px;color:var(--ink)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:25px}.sidebar{align-self:start;position:sticky;top:16px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:var(--shadow)}.nav{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;border-radius:12px;background:transparent;color:#65685f;text-align:left;margin:3px 0}.nav.active{background:var(--green-light);color:#405541;font-weight:650}.side-note{margin:22px 7px 6px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.main{min-width:0}.eyebrow{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.heading{font-size:27px;line-height:1.3;letter-spacing:-.04em;margin:5px 0 7px}.sub{color:var(--muted);margin:0 0 23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:18px}.stat,.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;font-weight:650;margin-top:7px}.stat small{font-size:12px;color:var(--muted);font-weight:400}.panel{padding:21px;margin-bottom:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h3,.card h3{font-size:15px;margin:0;font-weight:700}.quick{display:flex;gap:10px}.quick input{flex:1;min-width:0;border:1px solid var(--line);background:#fbfaf6;padding:12px;border-radius:12px}.entry{padding:14px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0;padding-top:0}.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.entry h4{font-size:15px;margin:0 0 5px}.entry p{margin:0;color:#6f7269;white-space:pre-wrap;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:9px;flex-wrap:wrap}.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--green-light);color:#536952;font-size:12px}.tag.peach{background:var(--peach);color:#936d54}.tag.lav{background:var(--lav);color:#6c648c}.muted{color:var(--muted)}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.searchrow{display:flex;gap:10px;margin-bottom:14px}.searchrow input,.searchrow select,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfaf6;color:var(--ink)}.searchrow input{flex:1}.searchrow select{width:auto;min-width:130px}.goal{padding:16px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0}.goal-top{display:flex;justify-content:space-between;gap:12px}.goal h4{margin:0 0 5px}.goal p{margin:0;color:var(--muted);font-size:13px}.progress{height:7px;background:#efeee8;border-radius:20px;overflow:hidden;margin:12px 0 8px}.progress div{height:100%;background:var(--green);border-radius:20px}.goal-actions{display:flex;gap:8px;align-items:center}.goal-actions select{border:1px solid var(--line);border-radius:9px;padding:6px;background:#fffefa}.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px 7px}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:600}.field textarea{min-height:100px;resize:vertical}.field input[type=range]{padding:0}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}.modal{position:fixed;inset:0;background:#20251e66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.open{display:flex}.dialog{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:22px;padding:24px;box-shadow:0 24px 80px #0002}.dialog h2{font-size:21px;margin:0 0 18px}.dialog-top{display:flex;justify-content:space-between;align-items:center}.dialog-top button{font-size:23px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#30372f;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:20;box-shadow:var(--shadow)}.toast.show{display:block}.footer{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
@media(max-width:720px){.app{padding:18px 13px 40px}.layout{grid-template-columns:1fr;gap:15px}.sidebar{position:static;display:flex;gap:4px;overflow:auto;padding:7px}.nav{white-space:nowrap;justify-content:center;width:auto;flex:1;padding:10px 12px;font-size:13px}.side-note{display:none}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}.panel{padding:16px}.heading{font-size:24px}.review-grid{grid-template-columns:1fr}.quick{flex-direction:column}.quick .primary{width:100%}.top{margin-bottom:20px}.brand p{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">✳</div><div><h1>个人空间 <span class="muted">· Life OS</span></h1><p>慢慢整理生活，也慢慢认识自己。</p></div></div><button class="primary" id="newEntryBtn">＋ 写一篇</button></header>
<div class="layout">
<aside class="sidebar">
<button class="nav active" data-page="home">⌂ 总览</button><button class="nav" data-page="entries">☷ 我的记录</button><button class="nav" data-page="goals">◎ 人生目标</button><button class="nav" data-page="reviews">↻ 回顾复盘</button>
<div class="side-note">给生活留一点空白。<br>不必每天进步，只要真实地生活。</div>
</aside>
<main class="main" id="main"></main>
</div><div class="footer">你的记录只保存在当前浏览器中 · 记得定期导出备份</div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><div class="dialog-top"><h2 id="modalTitle">写下此刻</h2><button class="iconbtn" id="closeModal" aria-label="关闭">×</button></div><form id="entryForm"><div class="field"><label for="entryTitle">标题</label><input id="entryTitle" maxlength="100" placeholder="给今天的感受起个名字"></div><div class="field"><label for="entryContent">此刻发生了什么？</label><textarea id="entryContent" required placeholder="写下你的想法、经历、感受……"></textarea></div><div class="review-grid"><div class="field"><label for="entryCategory">记录分类</label><select id="entryCategory"><option>日常生活</option><option>自我成长</option><option>事业与财务</option><option>家庭与关系</option><option>灵感想法</option></select></div><div class="field"><label for="entryMood">现在的心情</label><select id="entryMood"><option value="😌 平静">😌 平静</option><option value="😊 开心">😊 开心</option><option value="😐 普通">😐 普通</option><option value="😔 低落">😔 低落</option><option value="😤 焦虑">😤 焦虑</option></select></div></div><div class="actions"><button type="button" class="ghost" id="cancelEntry">取消</button><button class="primary" type="submit">保存记录</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const KEY='life-os-v1';
const blank={entries:[],goals:[],reviews:[]};
let data;try{data=JSON.parse(localStorage.getItem(KEY))||structuredClone(blank)}catch(e){data={entries:[],goals:[],reviews:[]}}
let page='home';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateText=v=>new Date(v).toLocaleString('zh-CN',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const dayText=v=>new Date(v).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2100)}
function openModal(){ $('#modal').classList.add('open');$('#entryTitle').focus() }
function closeModal(){ $('#modal').classList.remove('open');$('#entryForm').reset() }
$('#newEntryBtn').addEventListener('click',openModal);$('#closeModal').addEventListener('click',closeModal);$('#cancelEntry').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();data.entries.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:$('#entryTitle').value.trim()||'一条生活记录',content:$('#entryContent').value.trim(),category:$('#entryCategory').value,mood:$('#entryMood').value,createdAt:new Date().toISOString()});save();closeModal();render();toast('已保存，感谢你记录此刻。')});
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));render()}));
function entryHTML(x){return `<article class="entry"><div class="entry-top"><div><h4>${esc(x.title)}</h4><p>${esc(x.content)}</p></div><button class="iconbtn" data-delete-entry="${esc(x.id)}" title="删除记录" aria-label="删除记录">×</button></div><div class="meta"><span>${esc(dateText(x.createdAt))}</span><span class="tag">${esc(x.category)}</span><span class="tag peach">${esc(x.mood)}</span></div></article>`}
function home(){return `<div class="eyebrow">${esc(dayText(new Date()))}</div><h2 class="heading">给自己一点空间。</h2><p class="sub">不需要把一切都想明白，从记录此刻开始。</p><section class="stats"><div class="stat"><span>累计记录</span><strong>${data.entries.length}<small> 篇</small></strong></div><div class="stat"><span>人生目标</span><strong>${data.goals.length}<small> 个</small></strong></div><div class="stat"><span>复盘次数</span><strong>${data.reviews.length}<small> 次</small></strong></div></section><section class="panel"><div class="panel-head"><h3>✎ 快速记录</h3><span class="muted">把脑海里的事放下来</span></div><div class="quick"><input id="quickText" placeholder="此刻在想什么？写一句也可以"><button class="primary" id="quickSave">保存想法</button></div></section><section class="panel"><div class="panel-head"><h3>最近的记录</h3><button class="ghost" data-goto="entries">查看全部</button></div>${data.entries.length?data.entries.slice(0,4).map(entryHTML).join(''):'<div class="empty">这里还很安静。<br>写下第一篇记录，开启你的个人空间。</div>'}</section><section class="panel"><div class="panel-head"><h3>人生目标进度</h3><button class="ghost" data-goto="goals">管理目标</button></div>${data.goals.length?data.goals.slice(0,3).map(goalHTML).join(''):'<div class="empty">目标不必宏大，先写下你想靠近的方向。</div>'}</section>`}
function entriesPage(){return `<div class="eyebrow">YOUR JOURNAL</div><h2 class="heading">我的记录</h2><p class="sub">生活中的片段、情绪和灵感，都值得被看见。</p><section class="panel"><div class="searchrow"><input id="searchEntries" placeholder="搜索标题或内容……"><select id="filterCategory"><option value="">全部分类</option>${['日常生活','自我成长','事业与财务','家庭与关系','灵感想法'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="entryList">${data.entries.length?data.entries.map(entryHTML).join(''):'<div class="empty">还没有记录，点击右上角「写一篇」开始吧。</div>'}</div></section>`}
function goalHTML(g){return `<div class="goal"><div class="goal-top"><div><h4>${esc(g.title)}</h4><p>${esc(g.area)}${g.note?' · '+esc(g.note):''}</p></div><button class="iconbtn" data-delete-goal="${esc(g.id)}" aria-label="删除目标">×</button></div><div class="progress"><div style="width:${Number(g.progress)||0}%"></div></div><div class="goal-top"><span class="muted">${Number(g.progress)||0}% 完成</span><div class="goal-actions"><select data-progress="${esc(g.id)}" aria-label="更新进度"><option value="0" ${+g.progress===0?'selected':''}>0%</option><option value="25" ${+g.progress===25?'selected':''}>25%</option><option value="50" ${+g.progress===50?'selected':''}>50%</option><option value="75" ${+g.progress===75?'selected':''}>75%</option><option value="100" ${+g.progress===100?'selected':''}>100%</option></select></div></div></div>`}
function goalsPage(){return `<div class="eyebrow">DIRECTION & INTENTION</div><h2 class="heading">人生目标</h2><p class="sub">目标是方向，不是拿来责备自己的尺子。</p><section class="panel"><div class="panel-head"><h3>添加一个目标</h3></div><form id="goalForm"><div class="field"><label for="goalTitle">目标名称</label><input id="goalTitle" required maxlength="100" placeholder="例如：建立稳定的个人事业"></div><div class="review-grid"><div class="field"><label for="goalArea">所属领域</label><select id="goalArea"><option>事业</option><option>自我成长</option><option>家庭与关系</option><option>财务</option><option>生活</option><option>健康</option></select></div><div class="field"><label for="goalNote">补充说明（选填）</label><input id="goalNote" placeholder="为什么它对你重要？"></div></div><div class="actions"><button class="primary" type="submit">＋ 添加目标</button></div></form></section><section class="panel"><div class="panel-head"><h3>正在靠近的方向</h3><span class="muted">${data.goals.length} 个目标</span></div>${data.goals.length?data.goals.map(goalHTML).join(''):'<div class="empty">你可以先从一个小目标开始。</div>'}</section>`}
const prompts=[['充实的事','这周什么时刻让你觉得值得？'],['消耗自己的事','什么事情让你疲惫或分心？'],['新的发现','你对自己或生活有了什么新认识？'],['下周行动','下周最想完成的一件小事是什么？']];
function reviewHTML(r){return `<article class="entry"><div class="entry-top"><h4>${esc(dayText(r.createdAt))} · 每周回顾</h4><button class="iconbtn" data-delete-review="${esc(r.id)}" aria-label="删除复盘">×</button></div>${prompts.map((p,i)=>`<p style="margin-top:9px"><strong>${esc(p[0])}：</strong>${esc(r.answers[i]||'（未填写）')}</p>`).join('')}</article>`}
function reviewsPage(){return `<div class="eyebrow">PAUSE & REFLECT</div><h2 class="heading">回顾与复盘</h2><p class="sub">不急着评判自己，先温柔地看清发生了什么。</p><section class="panel"><div class="panel-head"><h3>这周，想和自己聊聊</h3></div><form id="reviewForm"><div class="review-grid">${prompts.map((p,i)=>`<div class="field"><label for="review${i}">${i+1}. ${esc(p[0])}</label><textarea id="review${i}" placeholder="${esc(p[1])}"></textarea></div>`).join('')}</div><div class="actions"><button class="primary" type="submit">保存这次复盘</button></div></form></section><section class="panel"><div class="panel-head"><h3>过往复盘</h3><span class="muted">${data.reviews.length} 次</span></div>${data.reviews.length?data.reviews.map(reviewHTML).join(''):'<div class="empty">写下第一次复盘，给自己一次停下来整理的机会。</div>'}</section>`}
function render(){const main=$('#main');main.innerHTML=page==='home'?home():page==='entries'?entriesPage():page==='goals'?goalsPage():reviewsPage();bindPage()}
function bindPage(){
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));render()});
const quick=$('#quickSave');if(quick)quick.onclick=()=>{const input=$('#quickText');if(!input.value.trim()){input.focus();return}data.entries.unshift({id:String(Date.now()),title:'随手记',content:input.value.trim(),category:'日常生活',mood:'😌 平静',createdAt:new Date().toISOString()});save();render();toast('想法已保存。')};
const search=$('#searchEntries'),filter=$('#filterCategory');function filterEntries(){if(!$('#entryList'))return;const q=(search?.value||'').toLowerCase(),c=filter?.value||'';const found=data.entries.filter(x=>(!c||x.category===c)&&(x.title+' '+x.content).toLowerCase().includes(q));$('#entryList').innerHTML=found.length?found.map(entryHTML).join(''):'<div class="empty">没有找到匹配的记录。</div>';bindDelete()}
if(search)search.addEventListener('input',filterEntries);if(filter)filter.addEventListener('change',filterEntries);
const gf=$('#goalForm');if(gf)gf.onsubmit=e=>{e.preventDefault();data.goals.unshift({id:String(Date.now()),title:$('#goalTitle').value.trim(),area:$('#goalArea').value,note:$('#goalNote').value.trim(),progress:0});save();render();toast('目标已添加。')};
const rf=$('#reviewForm');if(rf)rf.onsubmit=e=>{e.preventDefault();const answers=prompts.map((_,i)=>$('#review'+i).value.trim());if(!answers.some(Boolean)){toast('先写下一点内容吧。');return}data.reviews.unshift({id:String(Date.now()),answers,createdAt:new Date().toISOString()});save();render();toast('这次复盘已保存。')};
document.querySelectorAll('[data-progress]').forEach(s=>s.onchange=()=>{const g=data.goals.find(x=>x.id===s.dataset.progress);if(g){g.progress=Number(s.value);save();render();toast('目标进度已更新。')}});
bindDelete()
}
function bindDelete(){
document.querySelectorAll('[data-delete-entry]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这条记录吗？')){data.entries=data.entries.filter(x=>x.id!==b.dataset.deleteEntry);save();render();toast('记录已删除。')}});
document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这个目标吗？')){data.goals=data.goals.filter(x=>x.id!==b.dataset.deleteGoal);save();render();toast('目标已删除。')}});
document.querySelectorAll('[data-delete-review]').forEach(b=>b.onclick=()=>{if(confirm('确定删除这次复盘吗？')){data.reviews=data.reviews.filter(x=>x.id!==b.dataset.deleteReview);save();render();toast('复盘已删除。')}});
}
render();
})();
</script>
</body></html>
